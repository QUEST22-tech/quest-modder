<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal VR Mod Installer</title>
    
    <!-- Flat layout delivery scripts loaded globally to completely bypass browser blocks -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 40px 20px; 
            background: #121214; 
            color: #ffffff; 
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1a1a1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .logo-img {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
        }
        h1 { color: #3b82f6; margin-bottom: 10px; }
        p { color: #a1a1aa; font-size: 14px; margin-bottom: 30px; }
        #connectBtn { 
            background: #2563eb; 
            color: white; 
            border: none; 
            padding: 14px 28px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        #connectBtn:hover { background: #1d4ed8; }
        #status { 
            margin-top: 25px; 
            font-weight: 500; 
            font-size: 15px;
            background: #27272a;
            padding: 15px;
            border-radius: 6px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Embedded app logo vector HEADSET icon -->
        <img class="logo-img" src="https://flaticon.com" alt="VR Logo">
        
        <h1>Universal VR Mod Installer</h1>
        <p>Connect your Meta Quest via USB to inject standalone mods instantly.</p>
        
        <button id="connectBtn">🔌 Connect VR Headset</button>
        
        <div id="status">Status: Ready to connect...</div>
    </div>

    <script>
        // Global library extractions
        const Adb = window['@yume-chan/adb']?.Adb;
        const AdbWebUsbBackend = window['@yume-chan/adb-backend-webusb']?.AdbWebUsbBackend;

        // Swapped out SongDownloader for CoreMods.qmod with zero-fetch layout
        const modConfig = {
            "bonelab_mods": [
                "Mulletman2113.WagieFord.pallet.json",
                "Mulletman2113.WagieFord_mon.bundle",
                "catalog_Mulletman2113.WagieFord.hash",
                "catalog_Mulletman2113.WagieFord.json"
            ],
            "beatsaber_mods": [
                "CoreMods.qmod"
            ]
        };

        document.getElementById('connectBtn').addEventListener('click', async () => {
            const statusText = document.getElementById('status');
            statusText.style.color = "#ffffff";
            statusText.innerText = "Status: Connecting to browser USB driver...";

            try {
                if (!Adb || !AdbWebUsbBackend) {
                    throw new Error("Drivers failed to initialize. Check your network connection!");
                }

                // Triggers the headset picker popup immediately
                const device = await navigator.usb.requestDevice({ filters: [] });
                statusText.innerText = `Status: Found ${device.productName}. Opening protocol pathways...`;

                const backend = new AdbWebUsbBackend(device);
                const adb = await Adb.create(backend);
                
                statusText.style.color = "#3b82f6"; 
                statusText.innerText = "Status: Connected! Opening data sync stream...";

                const sync = await adb.sync();

                // 1. INJECT BONELAB MODS (Looks inside your mods/bonelab subfolder path)
                statusText.innerText = "Status: Injecting avatar files into BONELAB partition...";
                const bonelabFolder = '/sdcard/Android/data/com.StressLevelZero.BONELAB/files/Mods/';

                for (const modName of modConfig.bonelab_mods) {
                    try {
                        const response = await fetch(`./mods/bonelab/${modName}`);
                        if (!response.ok) continue; 
                        const buffer = await response.arrayBuffer();
                        
                        const writer = await sync.write(`${bonelabFolder}${modName}`);
                        await writer.write(new Uint8Array(buffer));
                        await writer.close();
                    } catch (e) {
                        console.error(`Failed to push ${modName}:`, e);
                    }
                }

                // 2. INJECT BEAT SABER MODS (Pushes CoreMods.qmod directly to target directory)
                statusText.innerText = "Status: Injecting core configurations into Beat Saber...";
                const beatSaberFolder = '/sdcard/ModData/com.beatgames.beatsaber/Mods/';

                for (const modName of modConfig.beatsaber_mods) {
                    try {
                        const response = await fetch(`./${modName}`);
                        if (!response.ok) continue;
                        const buffer = await response.arrayBuffer();
                        
                        const writer = await sync.write(`${beatSaberFolder}${modName}`);
                        await writer.write(new Uint8Array(buffer));
                        await writer.close();
                    } catch (e) {
                        console.error(`Failed to push ${modName}:`, e);
                    }
                }

                await sync.close();
                statusText.style.color = "#4ade80"; 
                statusText.innerText = "Status: Success! All available mods have been successfully pushed into your headset.";

            } catch (error) {
                statusText.style.color = "#ef4444"; 
                statusText.innerText = "🚨 Modding Failure: " + error.message;
                console.error(error);
            }
        });
    </script>
</body>
</html>
